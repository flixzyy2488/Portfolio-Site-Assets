<!-- PORTFOLIO SCRIPTS (3 of 3): paste into a THIRD Code Embed element placed directly below the content embed (portfolio-embed.html). -->
<!-- Optional: drives the live background and cursor effects. The page is complete without it. -->
<script>
(function(){
 var root=document.getElementById('pf-top'),layer=document.getElementById('pf-cursor'),cv=document.getElementById('pf-fx');
 var g=cv&&cv.getContext&&cv.getContext('2d');if(!root||!g)return;
 var ret=document.getElementById('pf-ret'),lab=ret.querySelector('span'),utc=document.getElementById('pf-utc');
 var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 var fine=window.matchMedia('(hover:hover) and (pointer:fine)').matches;
 var S=70,GS=58,RH=S*.866,R=190,W,H,cols,rows,X,Y,G,Z,P,dpr=Math.min(window.devicePixelRatio||1,2);
 var px=-999,py=-999,mx=-999,my=-999,tx=0,ty=0,power=0,inside=false,first=true,rings=[];
 var lc=document.createElement('canvas'),lg=lc.getContext('2d');   // spare canvas for the air page's glow
 root.classList.add('pf-live');

 function size(){
  W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  lc.width=W*dpr;lc.height=H*dpr;lg.setTransform(dpr,0,0,dpr,0,0);
  cols=Math.ceil(W/GS)+4;rows=Math.ceil(H/RH)+5;
  X=new Float32Array(cols*rows);Y=new Float32Array(cols*rows);G=new Float32Array(cols*rows);Z=new Float32Array(cols*rows);P=new Uint8Array(rows);
 }
 function rnd(i,j){var v=Math.sin(i*127.1+j*311.7)*43758.5453;return v-Math.floor(v);}
 // smooth random noise, used to build terrain with no repeating pattern
 function vn(x,y){
  var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),
      a=rnd(xi,yi),b=rnd(xi+1,yi),c=rnd(xi,yi+1),d=rnd(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
 }

 // streams of air: seven long, gentle curves per 640px band, drifting left at an unhurried 17px a second.
 // They only ever deflect up or down, through smooth falloffs, so nothing kinks near the cursor.
 // The glow is built as a light map on a spare canvas (one soft disc per cursor/ripple) and then cut to the
 // shape of the lines in a single pass, so its cost barely grows however many ripples are on screen.
 var AIR=[[90,30,.2],[170,50,.12],[250,35,.22],[330,60,.1],[410,25,.18],[490,45,.1],[570,25,.16]];
 var wake=[],airOn=false;   // where the cursor has just been on the air page; each point fades within one second
 function airflow(t){
  var band,L,x,k,r,gr,o,sh=t*17.14,q=6.2832/1200,RA=250,R2=RA*RA,lit=0,C='rgba(215,232,255,',all=new Path2D(),wk,v;
  // Wake points are laid along the cursor's smoothed path. Each one's strength drops steeply at first and is
  // fully back at 1s (real time, so the same on any screen). A point contributes nothing while the cursor is
  // still on top of it and takes over as the cursor moves away, so nothing pops in when a point is created.
  var lw=wake[wake.length-1],gx,gy,gd,n,i;
  if(power>.2){
   if(!lw)wake.push({x:mx,y:my,a:0,b:t});
   else{
    gx=mx-lw.x;gy=my-lw.y;gd=Math.sqrt(gx*gx+gy*gy);n=Math.min(12,Math.floor(gd/40));
    for(i=1;i<=n;i++)wake.push({x:lw.x+gx*i/n,y:lw.y+gy*i/n,a:0,b:t});
    while(wake.length>60)wake.shift();
   }
  }
  for(k=wake.length;k--;){
   wk=wake[k];v=t-wk.b;
   if(v>=1){if(wake.length>1||power<=.2)wake.splice(k,1);else wk.a=0;continue;}   // keep one anchor so the path stays continuous
   gx=wk.x-mx;gy=wk.y-my;gd=Math.min(1,Math.sqrt(gx*gx+gy*gy)/120*(power>.2?1:99));
   wk.a=Math.pow(1+v/.08,-1.2)*(1-v)*gd*gd*(3-2*gd)*Math.min(1,v/.04);   // last term: a 40ms fade-in, as a second guard against popping
  }
  lg.globalCompositeOperation='source-over';lg.clearRect(0,0,W,H);lg.globalCompositeOperation='lighter';
  if(power>.01){
   gr=lg.createRadialGradient(mx,my,0,mx,my,RA);gr.addColorStop(0,C+(.9*power)+')');gr.addColorStop(1,C+'0)');
   lg.fillStyle=gr;lg.fillRect(mx-RA,my-RA,RA*2,RA*2);lit=1;
  }
  for(k=0;k<wake.length;k++){
   wk=wake[k];if(wk.a<.01)continue;gr=lg.createRadialGradient(wk.x,wk.y,0,wk.x,wk.y,RA);gr.addColorStop(0,C+(.5*wk.a)+')');gr.addColorStop(1,C+'0)');
   lg.fillStyle=gr;lg.fillRect(wk.x-RA,wk.y-RA,RA*2,RA*2);lit=1;
  }
  for(k=0;k<rings.length;k++){
   r=rings[k];o=r.rad+r.w;var ga=r.life*r.l*1.2;if(ga<.02)continue;
   gr=lg.createRadialGradient(r.x,r.y,Math.max(0,r.rad-r.w),r.x,r.y,o);
   gr.addColorStop(0,C+'0)');gr.addColorStop(.5,C+(ga>1?1:ga)+')');gr.addColorStop(1,C+'0)');
   lg.fillStyle=gr;lg.fillRect(r.x-o,r.y-o,o*2,o*2);lit=1;
  }
  g.lineJoin='round';g.lineWidth=1;
  for(band=0;band*640<H;band++)for(L=0;L<AIR.length;L++){
   var y0=band*640+AIR[L][0],amp=AIR[L][1]*.75;
   g.beginPath();
   for(x=-8;x<=W+8;x+=4){
    var y=y0-amp*Math.sin((x+sh)*q),oy=0,dx=x-mx,dy=y-my,d2=dx*dx+dy*dy;
    if(d2<R2){var f=1-d2/R2;oy=58*power*f*f*dy/(Math.abs(dy)+16);}   // air parts around the cursor
    for(k=0;k<wake.length;k++){   // ...and stays parted for a moment where the cursor has been
     wk=wake[k];if(wk.a<.01)continue;dx=x-wk.x;if(dx>RA||dx<-RA)continue;
     dy=y-wk.y;d2=dx*dx+dy*dy;if(d2>=R2)continue;
     f=1-d2/R2;oy+=58*wk.a*f*f*dy/(Math.abs(dy)+16);
    }
    oy=62*Math.tanh(oy/62);   // pushes add up smoothly but level off, so overlapping wake points never stack into a spike
    for(k=0;k<rings.length;k++){
     r=rings[k];var ex=x-r.x,ey=y-r.y;o=r.rad+r.w;
     if(ex>o||ex<-o||ey>o||ey<-o)continue;
     var e=Math.sqrt(ex*ex+ey*ey),bd=1-Math.abs(e-r.rad)/r.w;
     if(bd>0)oy+=ey/Math.sqrt(e*e+400)*bd*bd*(3-2*bd)*r.life*r.p;
    }
    if(x<0){g.moveTo(x,y+oy);all.moveTo(x,y+oy);}else{g.lineTo(x,y+oy);all.lineTo(x,y+oy);}
   }
   g.strokeStyle='rgba(169,200,255,'+AIR[L][2]+')';g.stroke();
  }
  if(lit){
   lg.globalCompositeOperation='destination-in';lg.lineJoin='round';lg.lineWidth=1.3;lg.strokeStyle='#fff';lg.stroke(all);
   g.drawImage(lc,0,0,W,H);
  }
 }

 // stars: the rocket page, a still night sky. Each star keeps its place and twinkles slowly at its own pace.
 // The cursor parts them and lights them up, and clicks and the heartbeat send a ring through them.
 function starfield(t){
  var n=Math.round(W*H/2400),i,k,r,z,x,y,dx,dy,d,f,lit,sz,a,c;
  for(i=0;i<n;i++){
   z=rnd(i,7);z*=z;x=rnd(i,1)*W;y=rnd(i,3)*H;lit=0;
   dx=x-mx;dy=y-my;d=Math.sqrt(dx*dx+dy*dy)||1;
   if(d<R){f=1-d/R;f=f*f*power;x+=dx/d*f*20;y+=dy/d*f*20;lit=f;}
   for(k=0;k<rings.length;k++){
    r=rings[k];dx=x-r.x;dy=y-r.y;d=Math.sqrt(dx*dx+dy*dy)||1;f=1-Math.abs(d-r.rad)/r.w;
    if(f>0){f*=r.life;x+=dx/d*f*r.p;y+=dy/d*f*r.p;lit+=f*r.l;}
   }
   if(lit>1)lit=1;sz=1+z*1.9+lit*1.4;
   f=.5+.5*Math.sin(t*(.4+rnd(i,5)*1.3)+rnd(i,9)*6.28);   // twinkle
   c=rnd(i,11)>.8?'170,200,255,':'235,240,255,';a=Math.min(1,(.4+z*.6)*(.6+.4*f)+lit*.6);
   g.fillStyle='rgba('+c+a+')';g.beginPath();g.arc(x,y,sz/2,0,6.2832);g.fill();
  }
 }

 function frame(now){
  var t=now*.001,i,j,k,n,r;
  mx+=(px-mx)*.2;my+=(py-my)*.2;tx+=(px-tx)*.06;ty+=(py-ty)*.06;
  power+=((inside?1:0)-power)*.08;
  layer.style.setProperty('--tx',tx+'px');layer.style.setProperty('--ty',ty+'px');
  ret.style.transform='translate('+mx+'px,'+my+'px)';
  for(k=rings.length;k--;){r=rings[k];r.rad+=r.v;r.life*=r.d;if(r.life<.03)rings.splice(k,1);}
  // Three looks, one field. Home: random terrain seen from above, sliding slowly past.
  // Project views pick theirs with data-bg: "air" is streams of moving air, "grid" is a hard square lattice, "stars" is a still night sky.
  var mode=root.classList.contains('pf-away')?root.getAttribute('data-bg')||'':'',grid=mode==='grid',air=mode==='air';
  airOn=air;if(!air&&wake.length)wake.length=0;
  var sc=(window.pageYOffset||0)*.18,j0=Math.floor(sc/RH),fy=sc-j0*RH,dr=t*13,i0=Math.floor(dr/S),fx=dr-i0*S,jr,wi,a,b2,c2,al,sz;
  g.clearRect(0,0,W,H);

  // pass 1: position, height and cursor/ripple response of every node
  for(j=0;j<rows;j++){
   jr=j+j0;P[j]=jr&1;
   for(i=0;i<cols;i++){
    n=j*cols+i;wi=i+i0;
    var bx,by,z=0,ox=0,oy=0,hx=0,hy=0,hl=0,lit=0;
    if(grid){bx=(i-1)*GS;by=(j-1)*GS;}
    else{
     // each node keeps its identity in world space (wi, jr), so the ground travels instead of shimmering
     var wx=wi*S+(P[j]?S/2:0),wy=jr*RH;
     z=(1-Math.abs(2*vn(wx/300,wy/300)-1))*1.1-.55+(vn(wx/120+40,wy/120+17)-.5)*.8+(vn(wx/52+9,wy/52+71)-.5)*.45;
     bx=(i-2)*S-fx+(P[j]?S/2:0)+(rnd(wi,jr)-.5)*S*.4-z*8;   // high ground leans up and to the left,
     by=(j-2)*RH-fy+(rnd(wi+91,jr)-.5)*RH*.4-z*22;        // which tilts the faces and makes the relief read
    }
    var dx=bx-mx,dy=by-my,d=Math.sqrt(dx*dx+dy*dy)||1;
    if(d<R){var f=1-d/R;f=f*f*power;ox=dx/d*f*20;oy=dy/d*f*20;lit=f;}   // lens: nodes pushed away from the cursor
    for(k=0;k<rings.length;k++){
     r=rings[k];var ex=bx-r.x,ey=by-r.y,e=Math.sqrt(ex*ex+ey*ey)||1,band=1-Math.abs(e-r.rad)/r.w;
     if(band>0){
      band*=r.life;lit+=band*r.l;
      if(r.hb){hx+=ex/e*band*r.p;hy+=ey/e*band*r.p;hl+=band*r.l;}else{ox+=ex/e*band*r.p;oy+=ey/e*band*r.p;}
     }
    }
    // grid: cursor and click move it in hard 4px steps; only the heartbeat glides
    if(grid){X[n]=Math.round((bx+ox)/4)*4+hx;Y[n]=Math.round((by+oy)/4)*4+hy;}
    else{X[n]=bx+ox+hx;Y[n]=by+oy+hy;}
    G[n]=lit>1?1:lit;Z[n]=grid?hl:z;   // in grid mode Z holds the heartbeat's share of the light
   }
  }

  if(air)airflow(t);
  else if(mode==='stars')starfield(t);
  else if(grid){
   // hard square lattice: thin rules, slabs that fade in and out, heavy cross marks at every joint
   g.lineWidth=1;g.strokeStyle='rgba(150,170,220,.1)';g.beginPath();
   for(j=0;j<rows-1;j++)for(i=0;i<cols-1;i++){
    n=j*cols+i;g.moveTo(X[n],Y[n]);g.lineTo(X[n+1],Y[n+1]);g.moveTo(X[n],Y[n]);g.lineTo(X[n+cols],Y[n+cols]);
   }
   g.stroke();
   for(j=0;j<rows-1;j++)for(i=0;i<cols-1;i++){
    n=j*cols+i;var on=rnd(i*3+1,j*5+2)>.8;
    var ph=on?Math.sin(t*(.35+rnd(i+5,j)*.5)+rnd(i,j+9)*6.28):0;   // each slab breathes in and out at its own pace
    al=(ph>0?ph*ph*.12:0)+G[n]*.24;
    if(al>.015){
     g.fillStyle='rgba(110,145,235,'+al+')';g.beginPath();
     g.moveTo(X[n],Y[n]);g.lineTo(X[n+1],Y[n+1]);g.lineTo(X[n+cols+1],Y[n+cols+1]);g.lineTo(X[n+cols],Y[n+cols]);g.fill();
    }
   }
   g.lineWidth=2;
   for(j=0;j<rows-1;j++)for(i=0;i<cols-1;i++){
    n=j*cols+i;if(G[n]<.02)continue;
    g.strokeStyle='rgba(120,160,255,'+(G[n]*.95)+')';g.beginPath();
    g.moveTo(X[n],Y[n]);g.lineTo(X[n+1],Y[n+1]);g.moveTo(X[n],Y[n]);g.lineTo(X[n+cols],Y[n+cols]);g.stroke();
   }
   for(n=0;n<cols*rows;n++){
    al=.3+G[n]*.7;sz=(G[n]-Z[n]>.05?6:3.5)+Z[n]*9;   // cursor and click snap the size, the heartbeat swells it
    g.fillStyle='rgba(195,208,240,'+al+')';
    g.fillRect(X[n]-sz,Y[n]-1,sz*2,2);g.fillRect(X[n]-1,Y[n]-sz,2,sz*2);
   }
  }else{
   if(!air){
    // faces: slopes that face the light (upper left) are lit, the far sides stay dark, so ridges and valleys read as relief
    var face=function(p,q,o){
     var ux=X[q]-X[p],uy=Y[q]-Y[p],uz=Z[q]-Z[p],vx=X[o]-X[p],vy=Y[o]-Y[p],vz=Z[o]-Z[p],det=ux*vy-uy*vx;
     if(!det)return;
     var fa=.018-((uz*vy-vz*uy)+(ux*vz-vx*uz)*.8)/det*S*.5+(Z[p]+Z[q]+Z[o])*.012+G[p]*.16;
     if(fa<.012)return;
     g.fillStyle='rgba(45,95,255,'+(fa>.5?.5:fa)+')';g.beginPath();
     g.moveTo(X[p],Y[p]);g.lineTo(X[q],Y[q]);g.lineTo(X[o],Y[o]);g.fill();
    };
    for(j=0;j<rows-1;j++)for(i=1;i<cols-1;i++){
     n=j*cols+i;a=n+1;b2=n+cols+(P[j]?0:-1);c2=b2+1;
     face(n,c2,a);face(n,b2,c2);
    }
    g.lineWidth=1;g.strokeStyle='rgba(60,105,230,.11)';g.beginPath();
    for(j=0;j<rows-1;j++)for(i=1;i<cols-1;i++){
     n=j*cols+i;a=n+1;b2=n+cols+(P[j]?0:-1);c2=b2+1;
     g.moveTo(X[n],Y[n]);g.lineTo(X[a],Y[a]);
     g.moveTo(X[n],Y[n]);g.lineTo(X[b2],Y[b2]);
     g.moveTo(X[n],Y[n]);g.lineTo(X[c2],Y[c2]);
    }
    g.stroke();
   }
   // edges near the cursor and ripples light up
   g.lineWidth=1;
   for(j=0;j<rows-1;j++)for(i=1;i<cols-1;i++){
    n=j*cols+i;if(G[n]<.02)continue;
    a=n+1;b2=n+cols+(P[j]?0:-1);c2=b2+1;
    g.strokeStyle=(air?'rgba(170,205,255,':'rgba(80,135,255,')+(G[n]*.9)+')';g.beginPath();
    g.moveTo(X[n],Y[n]);g.lineTo(X[a],Y[a]);
    g.moveTo(X[n],Y[n]);g.lineTo(X[b2],Y[b2]);
    g.moveTo(X[n],Y[n]);g.lineTo(X[c2],Y[c2]);
    g.stroke();
   }
   // nodes, brighter on high ground
   for(n=0;n<cols*rows;n++){
    if(air&&G[n]<.02)continue;
    al=(air?0:.16+(Z[n]>0?Z[n]*.45:0))+G[n]*.8;sz=1.5+G[n]*2.6;
    g.fillStyle=G[n]>.05?'rgba(130,170,255,'+al+')':'rgba(60,110,255,'+al+')';
    g.fillRect(X[n]-sz/2,Y[n]-sz/2,sz,sz);
   }
  }

  if(!still)requestAnimationFrame(frame);
 }

 function clock(){if(utc)utc.textContent='UTC '+new Date().toISOString().slice(11,19);}
 clock();setInterval(clock,1000);
 size();window.addEventListener('resize',size);
 requestAnimationFrame(frame);
 if(still||!fine)return;   // touch / reduced motion: background only, no cursor tracking

 window.addEventListener('pointermove',function(e){
  px=e.clientX;py=e.clientY;inside=true;
  if(first){mx=tx=px;my=ty=py;first=false;}
  lab.textContent='X '+('000'+Math.round(px)).slice(-4)+' / Y '+('000'+Math.round(py)).slice(-4);
  var was=hot;hot=!!(e.target.closest&&e.target.closest('a,button,input,canvas,.pf-ready .pf-parts li,.pf-gal img,.pf-zoom'));   // over something clickable
  if(hot&&!was){clearTimeout(pt);pt=setTimeout(pulse,Math.max(0,1400/3-(performance.now()-lastBeat)));}   // switch to the fast pulse at once
  layer.classList.add('pf-on');
 },{passive:true});
 window.addEventListener('pointerdown',function(e){rings.push({x:e.clientX,y:e.clientY,rad:0,life:1,v:7,d:.972,w:46,p:14,l:.8});if(rings.length>28)rings.shift();});   // click sends a ripple
 // heartbeat: two slow, wide swells from the cursor (boom boom), then a rest.
 // They travel at a third of the click wave's speed, move the dots more and light them less.
 function beat(life){
  rings.push({x:mx,y:my,rad:0,life:life,v:7/3,d:.99,w:120,p:26,l:1.3,hb:1});
 }
 // resting pulse is one double-beat every 1.4s; over anything clickable it runs three times as fast
 var hot=false,pt=0,lastBeat=0;
 function pulse(){
  var k=hot?3:1;
  if(inside&&!document.hidden){beat(.34);setTimeout(function(){beat(.2);},300/k);}
  lastBeat=performance.now();pt=setTimeout(pulse,1400/k);
 }
 pulse();
 document.documentElement.addEventListener('pointerleave',function(){inside=false;layer.classList.remove('pf-on');});
 root.querySelectorAll('.pf-card').forEach(function(c){
  c.addEventListener('pointermove',function(e){
   var r=c.getBoundingClientRect();
   c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
 });
})();
</script>

<!-- Optional: 3D exploded viewer for the project detail views. three.js is only downloaded when a project is opened. -->
<script>
(function(){
 var CDN='https://cdn.jsdelivr.net/npm/three@0.160.0/';
 var THREE,views={};

 // runs fn over a list in short bursts and hands the page back in between, so preparing a model never locks up the page
 function each(list,fn,done){
  var i=0;
  (function go(){
   var t=performance.now();
   while(i<list.length&&performance.now()-t<8)fn(list[i++]);
   if(i<list.length)setTimeout(go,0);else done();
  })();
 }

 function viewer(box){
  var stage=box.querySelector('.pf-stage'),msg=stage.querySelector('.pf-stage-msg'),slider=box.querySelector('input'),
    items=[].slice.call(box.querySelectorAll('.pf-parts li'));
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  stage.insertBefore(renderer.domElement,stage.firstChild);
  var cv=renderer.domElement,scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.01,1000),group=new THREE.Group();
  var sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(3,5,4);
  scene.add(new THREE.HemisphereLight(0xc4d6ff,0x060a1e,1.7),sun,group);
  group.visible=false;   // stays hidden while the model is being prepared piece by piece
  var parts=[],sel=null,th=.75,ph=1.1,rad=6,baseRad=6,size=1,spin=true,raf=0,ray=new THREE.Raycaster();

  var pid=document.createElement('div');pid.className='pf-pid pf-mono';stage.appendChild(pid);   // shows the id of the selected piece

  // Splits one mesh into its separate solid bodies. CAD exports often merge every body that shares a material
  // into a single mesh; the bodies are still distinct closed shells inside it.
  //  1. Triangles are joined across each edge. Where bodies touch, an edge is shared by four or more triangles;
  //     there each triangle is paired with the one that closes the same solid wedge (found by sorting them
  //     around the edge), so touching bodies stay separate and each body stays whole.
  //  2. A hollow part has an outer skin and an inner cavity wall. The cavity (it encloses negative volume) is
  //     folded back into the body that contains it, so it does not show up as a second copy of the part.
  //  3. Leftovers with no volume (stray faces, sketch lines) join the nearest body.
  // Blender tacks .001, .002 ... onto material names each time a model is re-imported; drop that so ids stay stable
  function clean(nm){return nm.replace(/\.\d+$/,'');}
  function split(mesh){
   var geo=mesh.geometry,pos=geo.attributes.position,idx=geo.index,n=pos.count,tc=Math.floor((idx?idx.count:n)/3),i,t,e,a,b,c,k,l;
   if(Array.isArray(mesh.material)||tc<4)return null;
   var V=function(j){return idx?idx.getX(j):j;};
   var seen=new Map(),canon=new Int32Array(n),rep=[],nc=0;
   for(i=0;i<n;i++){
    k=Math.round(pos.getX(i)*1e3)+'_'+Math.round(pos.getY(i)*1e3)+'_'+Math.round(pos.getZ(i)*1e3);
    c=seen.get(k);if(c===undefined){c=nc++;seen.set(k,c);rep.push(i);}canon[i]=c;
   }

  (THREE?Promise.resolve():import(CDN+'+esm').then(function(m){THREE=m;})).then(function(){
   views[id]=viewer(box);views[id].run(el.classList.contains('pf-open'));
  }).catch(function(){
   delete views[id];box.querySelector('.pf-stage-msg').textContent='The 3D view needs WebGL and an internet connection.';
  });
 }
 var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

 // show the detail view with this id, or close them all when id is empty / not a project
 function shut(d){
  if(still){d.classList.remove('pf-open');return;}
  d.classList.add('pf-closing');
  setTimeout(function(){if(d.classList.contains('pf-closing'))d.classList.remove('pf-open','pf-closing');},320);
 }
 function show(id){
  var el=id&&document.getElementById(id),k;
  unzoom();
  if(el&&!el.classList.contains('pf-detail'))el=null;
  [].forEach.call(root.querySelectorAll('.pf-detail.pf-open'),function(d){if(d!==el&&!d.classList.contains('pf-closing'))shut(d);});
  for(k in views)if(views[k].run)views[k].run(false);
  root.classList.toggle('pf-away',!!el);
  if(el)root.setAttribute('data-bg',el.getAttribute('data-bg')||'');
  if(!el)return;
  halt();
  if(el.classList.contains('pf-closing'))el.classList.remove('pf-closing');
  else if(!el.classList.contains('pf-open')){el.classList.add('pf-open');el.scrollTop=0;}
  start(id,el);
 }
 function go(id){show(id);try{history.pushState(null,'',id?'#'+id:'#pf-work');}catch(_){}}

 // smooth scrolling: eased glide for in-page links, gentle inertia for the mouse wheel
 var sy=0,ty=0,tween=null,raf=0;
 function limit(){return Math.max(0,document.documentElement.scrollHeight-window.innerHeight);}
 function halt(){tween=null;sy=ty=window.pageYOffset;}
 function step(now){
  if(tween){
   var k=Math.min(1,(now-tween.t)/tween.d),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
   sy=tween.a+(tween.b-tween.a)*e;if(k>=1){tween=null;ty=sy;}
  }else{sy+=(ty-sy)*.1;if(Math.abs(ty-sy)<.5)sy=ty;}
  window.scrollTo(0,sy);
  raf=(tween||sy!==ty)?requestAnimationFrame(step):0;
 }
 function glide(el){
  // land with the section's heading just below the top bar: skip the section's own top padding, keep 64px for the bar plus 28px of air
  var pad=el.id==='pf-top'?0:(parseFloat(getComputedStyle(el).paddingTop)||0)-92;
  var to=Math.min(limit(),Math.max(0,el.getBoundingClientRect().top+window.pageYOffset+pad));
  if(still){window.scrollTo(0,to);return;}
  halt();tween={a:sy,b:to,t:performance.now(),d:Math.min(1400,500+Math.abs(to-sy)*.35)};
  if(!raf)raf=requestAnimationFrame(step);
 }
 if(!still){
  document.documentElement.style.scrollBehavior='auto';   // this script does the easing itself
  window.addEventListener('wheel',function(e){
   var d=e.deltaY*(e.deltaMode===1?36:1);
   // leave trackpads (small deltas), pinch-zoom and the project views to the browser
   if(e.ctrlKey||e.defaultPrevented||Math.abs(d)<50||root.querySelector('.pf-detail.pf-open'))return;
   e.preventDefault();
   if(!raf)halt();
   tween=null;ty=Math.min(limit(),Math.max(0,ty+d));
   if(!raf)raf=requestAnimationFrame(step);
  },{passive:false});
  ['pointerdown','touchstart','keydown'].forEach(function(n){window.addEventListener(n,function(){if(raf)halt();},{passive:true});});
 }

 // capture phase on window, so this runs before any site-wide smooth-scroll handler can swallow the click
 window.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href^="#pf-"]');
  if(!a||!root.contains(a))return;
  var id=a.getAttribute('href').slice(1),el=document.getElementById(id);
  if(!el)return;
  e.preventDefault();e.stopImmediatePropagation();
  if(a.classList.contains('pf-back'))go('');
  else if(el.classList.contains('pf-detail'))go(id);
  else{glide(el);try{history.pushState(null,'','#'+id);}catch(_){}}
 },true);
 function fromUrl(){show(location.hash.slice(1));}
 window.addEventListener('popstate',fromUrl);window.addEventListener('hashchange',fromUrl);fromUrl();

 // once the page itself has loaded, fetch and prepare everything the project views need (photos, three.js, the models)
 // in the background, so opening a project has nothing left to wait for
 function preload(){
  if(navigator.connection&&navigator.connection.saveData)return;   // visitor asked their browser to save data
  [].forEach.call(root.querySelectorAll('img'),function(im){im.loading='eager';if(im.decode)im.decode().catch(function(){});});
  [].forEach.call(root.querySelectorAll('.pf-detail'),function(d){if(d.id&&!views[d.id])start(d.id,d);});
 }
 function idle(){if('requestIdleCallback' in window)requestIdleCallback(preload,{timeout:2000});else setTimeout(preload,300);}
 if(document.readyState==='complete')idle();else window.addEventListener('load',idle);
 document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(zoom.classList.contains('pf-on'))unzoom();else if(root.querySelector('.pf-detail.pf-open'))go('');
 });
})();
</script>
